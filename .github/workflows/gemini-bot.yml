name: Gemini Automated PR Agent

on:
  issue_comment:
    types: [created]

jobs:
  create_pr:
    if: contains(github.event.comment.body, '@gemini-cli')
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
      issues: write

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Execute Gemini Prompt
        uses: google-github-actions/run-gemini-cli@v1
        with:
          gemini_api_key: ${{ secrets.GEMINI_API_KEY }}
          prompt: ${{ github.event.comment.body }}

      - name: Create Pull Request with Changes
        uses: peter-evans/create-pull-request@v6
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          commit-message: "feat: AI generated updates via Gemini"
          title: "AI Feature: ${{ github.event.issue.title }}"
          body: |
            Automated changes generated by Gemini AI.
            Triggered by comment: ${{ github.event.comment.body }}
          branch: "feature/gemini-${{ github.event.issue.number }}"
          base: main
