<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TooginTV | Musical Variety Stream</title>
    <link rel="stylesheet" href="css/styles.css">
</head>
<body>
    <div class="tv-static-overlay"></div>
    
   <header>
        <button id="theme-toggle" class="theme-toggle" aria-label="Toggle Light/Dark Mode">
            <span id="theme-icon">🌙</span> <!-- Defaults to moon -->
        </button>

        <div class="logo-container">
            <img src="img/logo.png" alt="TooginTV Logo">
            <h1 class="sr-only">TooginTV</h1>
        </div>
        <nav>
            <a href="index.html" class="active">Home</a>
            <!-- ... rest of your links ... -->
        </nav>
    </header>

    <main>
        <section class="broadcast-status">
            <h2>Next Toogin Thursday In:</h2>
            <div id="countdown-timer">Loading countdown...</div>
        </section>

        <section class="media-tabs">
            <div class="tab-buttons">
                <button class="tab-btn active" onclick="switchTab('twitch')">Twitch VODs</button>
                <button class="tab-btn" onclick="switchTab('tiktok')">TikTok Content</button>
            </div>
            
            <div id="twitch-tab" class="tab-content active">
                <h3>Latest Broadcast</h3>
                <div id="twitch-player-container">
                    <!-- Embedded Twitch Player loads here via JS -->
                </div>
            </div>

            <div id="tiktok-tab" class="tab-content">
                <h3>Latest from TikTok</h3>
                <div id="tiktok-embed-container">
                    <p>TikTok feed coming soon...</p>
                </div>
            </div>
        </section>
    </main>

    <script src="js/config.js"></script>
    <script src="js/main.js"></script>
</body>
</html>
